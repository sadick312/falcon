name: Lint, type check, build, tests and stats

on: push

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json

      - run: npm ci

      # ESLint has its own install (it needs TypeScript 6; the build uses TypeScript 7).
      - run: npm ci --prefix tools/lint

      - run: npm run lint

      - run: npm run typecheck

      # Builds the mod, the Quick Inject file and the extension, then checks every output (scripts/smoke-test.mjs).
      - run: npm run test:smoke

      - run: npm test

      # Builds both workspaces again, then compares against the committed stats/history.json (if any).
      # Fails the job when a build fails, e.g. over the bundle size limit.
      - run: npm run stats -- --label "ci"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-stats
          path: |
            stats/report.html
            stats/history.json
          if-no-files-found: warn
