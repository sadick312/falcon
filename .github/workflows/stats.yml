name: Type check, tests and stats

on: push

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # npm ci's postinstall also installed tools/lint (ESLint with its own TypeScript 6).
      - run: npm run lint

      - run: npm test

      # Builds both workspaces, then compares against the committed stats/history.json (if any).
      # Fails the job when a build fails, e.g. over the bundle size limit.
      - run: npm run stats -- --label "ci"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-stats
          path: |
            stats/report.html
            stats/history.json
          if-no-files-found: warn
